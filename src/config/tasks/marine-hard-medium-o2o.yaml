# ----- marine battle setting config -----

# get env information
env: "sc2"
# get task information
task: "marine-hard-medium-o2o"
# define train tasks and test tasks
train_tasks: ["3m", "5m_vs_6m", "9m_vs_10m"]
train_tasks_data_quality: {
    "3m": "medium",
    "5m_vs_6m": "medium",
    "9m_vs_10m": "medium",
}

test_tasks: ["3m", "4m", "5m", "10m", "12m", "5m_vs_6m", "7m_vs_8m", "8m_vs_9m", "9m_vs_10m", "10m_vs_11m", "10m_vs_12m", "13m_vs_15m"]
test_tasks_data_quality: {
}


# ----- online phase: 학습시킬 task를 여기서 지정 (항상 list) -----
# 개수는 1개든 3개든 4개든 전체든 상관없이 list로만 넣으면 됨.
#   one        : ["7m_vs_8m"]
#   same       : ["3m", "5m_vs_6m", "9m_vs_10m"]
#   hard       : ["8m_vs_9m", "10m_vs_11m", "13m_vs_15m"]
#   semi-hard  : ["7m_vs_8m", "8m_vs_9m", "10m_vs_11m"]
#   base (all) : 아래 전체 목록
online_train_tasks: ["3m", "4m", "5m", "10m", "12m", "5m_vs_6m", "7m_vs_8m", "8m_vs_9m", "9m_vs_10m", "10m_vs_11m", "10m_vs_12m", "13m_vs_15m"]
